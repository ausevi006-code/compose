services:
  api:
    build: .
    container_name: task-api
    ports:
      - "8080:8080"            
    environment:
      
      - CONNECTION_STRING=Host=db;Port=5432;Database=app;Username=postgres;Password=123
    depends_on:
      db:
        condition: service_healthy   
    restart: on-failure
    networks:
      - app-network

  db:
    image: postgres:16
    container_name: task-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=app
    volumes:
      - db_data:/var/lib/postgresql/data   
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:

volumes:
  db_data:     
